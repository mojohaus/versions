version: 2
updates:
- package-ecosystem: maven
  directory: "/"
  exclude-paths:
    - "versions-common/src/test/resources/**"
    - "versions-enforcer/src/it/**"
    - "versions-maven-plugin/src/it/**"
    - "versions-maven-plugin/src/test/resources/**"
  schedule:
    interval: monthly
  groups:
    maven:
      patterns: ["*"]
      update-types: ["minor", "patch"]
  ignore:
    # Stay on the Maven 3.9.x line; 3.10 is not the plugin baseline yet
    - dependency-name: "org.apache.maven:maven-artifact"
      versions: [">= 3.10.0"]
    - dependency-name: "org.apache.maven:maven-core"
      versions: [">= 3.10.0"]
    - dependency-name: "org.apache.maven:maven-model"
      versions: [">= 3.10.0"]
    - dependency-name: "org.apache.maven:maven-model-builder"
      versions: [">= 3.10.0"]
    - dependency-name: "org.apache.maven:maven-plugin-api"
      versions: [">= 3.10.0"]
    - dependency-name: "org.apache.maven:maven-settings"
      versions: [">= 3.10.0"]
    # plexus-xml 4.x depends on the Maven 4 XML API
    - dependency-name: "org.codehaus.plexus:plexus-xml"
      versions: [">= 4.0.0"]
    # Mockito 5 requires Java 11; the build still runs on JDK 8
    - dependency-name: "org.mockito:*"
      versions: [">= 5.0.0"]
    # Maven 3 so use SLF4J 1.7.x
    - dependency-name: "org.slf4j:*"
      versions: [">= 2.0.0"]
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: monthly
  groups:
    github-actions:
      patterns: ["*"]
